# Plugins (TPM). On Linux, chezmoi fetches TPM via .chezmoiexternal.toml.tmpl.
# After adding a plugin: prefix + I to install, prefix + U to update.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'   # sane defaults: history, focus-events, aggressive-resize, ...

# Theme (matches tokyonight-night in Neovim)
set -g @plugin 'janoamaral/tokyo-night-tmux'
set -g @tokyo-night-tmux_theme 'night'
set -g @tokyo-night-tmux_time_format 12H
set -g @tokyo-night-tmux_show_battery_widget 1

# Prefix stays the default C-b.

# Terminal: true color in Ghostty
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty:RGB"

# Short Esc delay so Neovim/Claude Code feel instant (0 can garble keys over SSH)
set -sg escape-time 10

# Resize to the most recently active client, not the smallest one
set -g window-size latest

# Vim keys in copy mode (prefix [): v to select, y to copy
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Number windows and panes from 1 (matches the keyboard)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Splits: | and -, opening in the current pane's directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style pane movement and resizing
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload config
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# Initialize TPM (must stay at the very end)
run '~/.tmux/plugins/tpm/tpm'
